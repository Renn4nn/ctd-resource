services:
  ctd-resource-db:
    image: pgvector/pgvector:pg18-trixie
    hostname: db
    container_name: ctd-resource-db
    restart: always
    env_file: .env.database.production
    ports:
      - "5432:5432"
    networks:
      - ctd-resource-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  ctd-resource-api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    image: ctd-resource-api:latest
    hostname: api
    container_name: ctd-resource-api
    restart: always
    env_file:
      - .env.database.production
      - .env.embedding.production
      - ./apps/api/.env.production
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      ctd-resource-db:
        condition: service_healthy
        restart: true
    networks:
      - ctd-resource-network

  ctd-resource-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    image: ctd-resource-web:latest
    hostname: web
    container_name: ctd-resource-web
    restart: always
    env_file:
      - ./apps/web/.env.production
    ports:
      - '3000:3000'
    depends_on:
      ctd-resource-db:
        condition: service_healthy
        restart: true
      ctd-resource-api:
        condition: service_started
    networks:
      - ctd-resource-network

networks:
  ctd-resource-network:
    name: ctd-resource-network
